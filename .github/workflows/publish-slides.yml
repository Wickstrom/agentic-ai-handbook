name: Publish slides

# Rebuild and deploy the Marimo WASM decks on every push to main.
#
# The repository is private, but a Pages site built from it is public unless
# the organisation's plan allows private Pages. If the decks must stay private,
# disable this workflow and build locally with scripts/build_slides.sh instead.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Export Marimo notebooks to WASM
        run: ./scripts/build_slides.sh

      - name: Upload _slides/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _slides

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
