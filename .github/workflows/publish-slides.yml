name: Publish slides

# Rebuild and deploy the Marimo WASM decks.
#
# Manual only. This repository is private, but a Pages site built from it is
# public unless the organisation's plan allows private Pages. Enable Pages in
# the repository settings, then run this workflow from the Actions tab.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      # `uv sync` rather than `--frozen`: the repository does not ship a
      # uv.lock yet. Commit the generated lockfile to pin CI to resolved
      # versions, then switch this back to `uv sync --frozen`.
      - name: Install Python dependencies
        run: uv sync

      - name: Export Marimo notebooks to WASM
        run: ./scripts/build_slides.sh

      - name: Upload _slides/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _slides

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
