name: Publish slides

# Rebuild and deploy the Marimo WASM decks on every push to main.
#
# Both the repository and the generated Pages site are public.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.12'

      # The committed uv.lock pins every dependency; --frozen makes CI fail
      # instead of silently re-resolving when the lockfile is out of date.
      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Export Marimo notebooks to WASM
        run: ./scripts/build_slides.sh

      - name: Upload _slides/ artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _slides

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
